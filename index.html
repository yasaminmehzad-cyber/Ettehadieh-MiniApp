<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>اتحادیه منچرز</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<main class="app">

<header style="text-align:center;padding:20px">
<h1>اتحادیه منچرز</h1>
</header>

<section class="balance-card">
<div class="balance-info">
<div class="label">موجودی شما</div>
<div class="amount">
<b>۲,۵۸۰,۰۰۰</b>
<span>تومان</span>
</div>
</div>
</section>

<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px">
<button class="details">افزایش موجودی</button>
<button class="details">برداشت</button>
</div>

<section class="history">
<div class="history-head">
<span>آمار بازی‌های ۲۴ ساعت گذشته</span>
</div>

<div class="history-line">
<span>بازی</span><b>12</b>
<span>برد</span><b>8</b>
<span>باخت</span><b>4</b>
</div>
</section>

<nav class="bottom-nav">
<button class="nav-item active">خانه</button>
<button class="nav-item">بازی‌ها</button>
<button class="nav-item">ماینر</button>
<button class="nav-item">تاریخچه</button>
<button class="nav-item">حساب</button>
</nav>

</main>

</body>
</html>
