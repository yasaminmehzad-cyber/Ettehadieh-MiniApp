<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#08051b">
  <title>اتحادیه منچرز</title>

  <style>
    *{box-sizing:border-box}

    :root{
      --bg:#07041a;
      --bg2:#0b0622;
      --card:#090622;
      --line:#6b35b7;
      --line2:#3c276e;
      --purple:#b75be8;
      --pink:#d85cd4;
      --text:#f4f0ff;
      --muted:#8f88a9;
      --muted2:#6e6789;
    }

    html,body{
      margin:0;
      min-height:100%;
      background:var(--bg);
      color:var(--text);
      font-family:Tahoma,"Segoe UI",sans-serif
    }

    body{overflow-x:hidden}

    button,a{
      font:inherit;
      color:inherit
    }

    a{
      text-decoration:none
    }

    .app{
      width:min(100%,720px);
      margin:auto;
      min-height:100vh;
      padding:28px 18px 118px;
      background:
        radial-gradient(ellipse at 50% 12%,rgba(110,35,180,.18),transparent 42%),
        radial-gradient(ellipse at 50% 62%,rgba(100,24,150,.12),transparent 45%),
        linear-gradient(180deg,#09041e 0%,#070419 100%);
    }

    .topbar{
      height:150px;
      display:grid;
      grid-template-columns:150px 1fr 90px;
      align-items:center;
      gap:8px
    }

    .header-tools{
      display:flex;
      gap:14px;
      align-items:center;
      direction:ltr
    }

    .tool{
      background:transparent;
      border:1px solid #5d566d;
      border-radius:0;
      width:58px;
      height:78px;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#b862e8;
      cursor:pointer
    }

    .square-dots{
      flex-direction:column;
      gap:7px
    }

    .square-dots i{
      width:7px;
      height:7px;
      border-radius:50%;
      background:#b862e8;
      display:block
    }

    .club{
      font-size:50px;
      font-family:Georgia,serif
    }

    .hamburger{
      width:76px;
      height:78px;
      justify-self:end;
      flex-direction:column;
      gap:9px
    }

    .hamburger span{
      width:43px;
      height:7px;
      background:#77737c;
      display:block
    }

    .brand{
      text-align:center;
      direction:rtl
    }

    .brand-en{
      font-family:cursive;
      font-style:italic;
      font-size:52px;
      line-height:1;
      color:#c35fdf;
      text-shadow:0 0 16px rgba(195,95,223,.18)
    }

    .brand-fa{
      font-size:20px;
      font-weight:700;
      color:#b56ad0;
      margin-top:10px
    }

    .balance-card{
      border:1px solid #6536a4;
      border-radius:44px 44px 42px 42px;
      overflow:hidden;
      background:linear-gradient(180deg,rgba(10,6,34,.98),rgba(7,4,25,.98));
      box-shadow:0 0 35px rgba(109,31,166,.09)
    }

    .balance-main{
      min-height:330px;
      padding:35px 30px 24px;
      display:flex;
      align-items:center;
      gap:24px;
      direction:ltr
    }

    .crown{
      width:40%;
      font-size:88px;
      text-align:center;
      color:#aaa;
      filter:drop-shadow(0 7px 4px #000);
      font-family:Georgia,serif
    }

    .balance-info{
      flex:1;
      text-align:right;
      direction:rtl
    }

    .label{
      font-size:31px;
      color:#858098;
      margin-bottom:18px
    }

    .amount{
      white-space:nowrap;
      display:flex;
      align-items:baseline;
      gap:8px;
      justify-content:flex-start;
      direction:rtl
    }

    .amount b{
      font-size:38px;
      letter-spacing:1px
    }

    .amount span{
      font-size:22px;
      color:#cf5cda;
      font-weight:700
    }

    .details{
      margin-top:32px;
      border:1px solid #8038cf;
      border-radius:34px;
      padding:12px 27px;
      background:transparent;
      color:#a66bbd;
      cursor:pointer;
      font-size:18px
    }

    .stats{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      border-top:1px solid #40315d;
      direction:rtl
    }

    .stat{
      min-height:145px;
      padding:24px 10px 18px;
      text-align:center;
      border-left:1px solid #40315d;
      color:#9189a8;
      font-size:21px;
      line-height:1.55
    }

    .stat:first-child{
      border-left:0
    }

    .stat strong{
      display:block;
      color:#fff;
      font-size:30px;
      margin-top:8px
    }

    .quick-grid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:18px;
      margin-top:28px;
      direction:rtl
    }

    .quick{
      min-height:226px;
      border:1px solid #6334a2;
      border-radius:50px;
      background:linear-gradient(180deg,#090622,#08051f);
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:8px;
      cursor:pointer;
      box-shadow:0 0 22px rgba(99,52,162,.06)
    }

    .quick.small{
      min-height:205px
    }

    .quick-icon{
      height:78px;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#fff
    }

    .gamepad{
      font-size:76px;
      line-height:1;
      transform:rotate(-8deg)
    }

    .bolt{
      font-size:86px;
      font-weight:900;
      line-height:1
    }

    .finance{
      font-size:72px;
      line-height:1
    }

    .ring{
      font-size:80px
    }

    .circle{
      font-size:76px
    }

    .quick-title{
      font-size:23px;
      font-weight:700
    }

    .quick-sub{
      font-size:15px;
      color:#7d7695
    }

    .quick:nth-child(4){
      grid-column:2
    }

    .quick:nth-child(5){
      grid-column:3
    }

    .history{
      margin-top:32px;
      border:1px solid #6334a2;
      border-radius:42px;
      padding:24px 22px;
      background:#090622
    }

    .history-head{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      color:#d99de7;
      font-size:22px;
      font-weight:700
    }

    .history-head button{
      border:1px solid #6d3aab;
      border-radius:24px;
      background:transparent;
      padding:8px 18px;
      color:#a996c4
    }

    .history-line{
      display:flex;
      justify-content:space-around;
      margin-top:22px;
      color:#827b9c;
      font-size:15px;
      align-items:center
    }

    .history-line b{
      color:#fff;
      font-size:23px
    }

    .bottom-nav{
      position:fixed;
      z-index:20;
      bottom:10px;
      left:50%;
      transform:translateX(-50%);
      width:min(calc(100% - 50px),660px);
      height:88px;
      border:1px solid #53327d;
      border-radius:38px;
      background:rgba(7,5,24,.96);
      display:grid;
      grid-template-columns:repeat(5,1fr);
      overflow:hidden;
      box-shadow:0 -8px 30px rgba(0,0,0,.28)
    }

    .nav-item{
      border:0;
      border-left:1px solid #392b50;
      background:transparent;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:4px;
      color:#8b83a6;
      cursor:pointer
    }

    .nav-item:last-child{
      border-left:0
    }

    .nav-item span{
      font-size:31px;
      line-height:1
    }

    .nav-item small{
      font-size:14px
    }

    .nav-item.active{
      color:#d65ad5;
      background:linear-gradient(180deg,rgba(106,37,135,.08),rgba(106,37,135,.22))
    }

    .overlay{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.65);
      z-index:50;
      display:none;
      align-items:flex-end
    }

    .overlay.show{
      display:flex
    }

    .sheet{
      width:min(100%,720px);
      margin:auto;
      background:#0a0621;
      border:1px solid #6937a7;
      border-bottom:0;
      border-radius:35px 35px 0 0;
      padding:24px 22px 34px;
      max-height:78vh;
      overflow:auto;
      position:relative
    }

    .sheet-close{
      position:absolute;
      left:18px;
      top:15px;
      width:38px;
      height:38px;
      border-radius:50%;
      border:1px solid #6c3aad;
      background:transparent;
      font-size:27px;
      cursor:pointer
    }

    .sheet h2{
      margin:4px 0 22px;
      text-align:center;
      color:#e29ae9
    }

    .games{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:14px
    }

    .game{
      border:1px solid #6034a1;
      border-radius:28px;
      background:#0b0725;
      padding:22px 12px;
      text-align:center;
      cursor:pointer;
      transition:.2s;
      display:block
    }

    .game:active{
      transform:scale(.97)
    }

    .game .gicon{
      font-size:44px;
      margin-bottom:8px
    }

    .game strong{
      display:block;
      font-size:19px;
      margin-bottom:7px
    }

    .game small{
      color:#77718e
    }

    .info{
      border:1px solid #6034a1;
      border-radius:25px;
      padding:22px;
      color:#aaa2bd;
      line-height:2
    }

    .toast{
      position:fixed;
      left:50%;
      bottom:110px;
      transform:translateX(-50%) translateY(20px);
      opacity:0;
      pointer-events:none;
      background:#17102e;
      border:1px solid #7940ba;
      color:#eee;
      padding:12px 22px;
      border-radius:28px;
      z-index:100;
      transition:.25s;
      white-space:nowrap
    }

    .toast.show{
      opacity:1;
      transform:translateX(-50%) translateY(0)
    }

    @media(max-width:560px){
      .app{
        padding-left:18px;
        padding-right:18px
      }

      .topbar{
        grid-template-columns:124px 1fr 72px;
        height:138px
      }

      .tool{
        width:50px;
        height:70px
      }

      .hamburger{
        width:65px
      }

      .brand-en{
        font-size:45px
      }

      .brand-fa{
        font-size:17px
      }

      .balance-main{
        min-height:300px;
        padding:26px 18px
      }

      .crown{
        font-size:70px
      }

      .label{
        font-size:27px
      }

      .amount b{
        font-size:31px
      }

      .amount span{
        font-size:18px
      }

      .details{
        font-size:16px;
        padding:10px 20px;
        margin-top:25px
      }

      .stat{
        font-size:17px;
        min-height:135px
      }

      .stat strong{
        font-size:24px
      }

      .quick-grid{
        gap:14px
      }

      .quick{
        min-height:205px;
        border-radius:43px
      }

      .quick.small{
        min-height:190px
      }

      .quick-title{
        font-size:21px
      }

      .history-head{
        font-size:18px
      }
    }
  </style>
</head>

<body>

<main class="app">

  <header class="topbar">

    <div class="header-tools">

      <button class="tool square-dots" aria-label="گزینه‌ها">
        <i></i><i></i><i></i>
      </button>

      <button class="tool club" aria-label="نشان">♣</button>

    </div>

    <div class="brand">
      <div class="brand-en">Unione</div>
      <div class="brand-fa">اتحادیه منچرز</div>
    </div>

    <button class="tool hamburger" aria-label="منو">
      <span></span>
      <span></span>
      <span></span>
    </button>

  </header>


  <section class="balance-card">

    <div class="balance-main">

      <div class="crown">♛</div>

      <div class="balance-info">

        <div class="label">موجودی کل</div>

        <div class="amount">
          <b>۲,۵۸۰,۰۰۰</b>
          <span>تومان</span>
        </div>

        <button class="details" onclick="toast('جزئیات موجودی')">
          ◉ مشاهده جزئیات
        </button>

      </div>

    </div>


    <div class="stats">

      <div class="stat">
        <div>موجودی قابل<br>برداشت</div>
        <strong>۱,۹۸۰,۰۰۰</strong>
      </div>

      <div class="stat">
        <div>مبلغ در انتظار</div>
        <strong>۳۲۰,۰۰۰</strong>
      </div>

      <div class="stat">
        <div>مبلغ رزرو<br>شده</div>
        <strong>۲۸۰,۰۰۰</strong>
      </div>

    </div>

  </section>


  <section class="quick-grid">

    <button class="quick" onclick="openPanel('games')">

      <div class="quick-icon gamepad">⌁</div>

      <div class="quick-title">بازی‌ها</div>

      <div class="quick-sub">همه بازی‌ها</div>

    </button>


    <button class="quick" onclick="toast('عملیات سریع ماینر')">

      <div class="quick-icon bolt">ϟ</div>

      <div class="quick-title">ماینر</div>

      <div class="quick-sub">عملیات سریع</div>

    </button>


    <button class="quick" onclick="toast('واریز / برداشت')">

      <div class="quick-icon finance">□</div>

      <div class="quick-title">مالی</div>

      <div class="quick-sub">واریز / برداشت</div>

    </button>


    <button class="quick small" onclick="openPanel('security')">

      <div class="quick-icon ring">◎</div>

      <div class="quick-title">امنیت</div>

      <div class="quick-sub">اثر انگشت</div>

    </button>


    <button class="quick small" onclick="openPanel('account')">

      <div class="quick-icon circle">●</div>

      <div class="quick-title">حساب</div>

      <div class="quick-sub">پروفایل و تنظیمات</div>

    </button>

  </section>


  <section class="history">

    <div class="history-head">

      <span>آمار بازی‌های ۲۴ ساعت گذشته</span>

      <button onclick="toast('فیلتر آمار')">
        منچ ۷
      </button>

    </div>


    <div class="history-line">

      <span>بازی‌ها</span>
      <b>۱۲</b>

      <span>برد</span>
      <b>۸</b>

      <span>باخت</span>
      <b>۴</b>

    </div>

  </section>


  <nav class="bottom-nav">

    <button class="nav-item active" onclick="setActive(this)">
      <span>⌂</span>
      <small>خانه</small>
    </button>

    <button class="nav-item" onclick="openPanel('games');setActive(this)">
      <span>⌘</span>
      <small>بازی‌ها</small>
    </button>

    <button class="nav-item" onclick="toast('ماینر');setActive(this)">
      <span>ϟ</span>
      <small>ماینر</small>
    </button>

    <button class="nav-item" onclick="toast('مالی');setActive(this)">
      <span>□</span>
      <small>مالی</small>
    </button>

    <button class="nav-item" onclick="openPanel('account');setActive(this)">
      <span>●</span>
      <small>حساب</small>
    </button>

  </nav>

</main>


<div class="overlay" id="overlay" onclick="closePanel(event)">

  <section class="sheet" id="sheet">

    <button class="sheet-close" onclick="closePanel()">
      ×
    </button>

    <h2 id="sheet-title">بازی‌ها</h2>

    <div id="sheet-content"></div>

  </section>

</div>


<div class="toast" id="toast"></div>


<script>

const games = [

  {
    icon:"🎮",
    name:"منچرز",
    text:"دانلود مستقیم از Google Play",
    url:"https://play.google.com/store/apps/details?id=com.incyteltech.mencherz"
  },

  {
    icon:"⛏️",
    name:"مارکرفت",
    text:"دانلود از Google Play",
    url:"https://play.google.com/store/apps/details?id=com.mojang.minecraftpe"
  },

  {
    icon:"🎲",
    name:"تخته‌نرد پلاتو",
    text:"Plato - Google Play",
    url:"https://play.google.com/store/apps/details?id=com.plato.android.mena"
  },

  {
    icon:"🃏",
    name:"حکم سوبرا",
    text:"سوبرا - Google Play",
    url:"https://play.google.com/store/apps/details?id=subra.v2.app"
  }

];


function toast(msg){

  const el=document.getElementById("toast");

  el.textContent=msg;

  el.classList.add("show");

  clearTimeout(window.__toast);

  window.__toast=setTimeout(
    ()=>el.classList.remove("show"),
    1700
  );

}


function openPanel(type){

  const overlay=document.getElementById("overlay");

  const title=document.getElementById("sheet-title");

  const content=document.getElementById("sheet-content");


  if(type==="games"){

    title.textContent="بازی‌ها";


    content.innerHTML=`

      <div class="games">

        ${games.map(g => `

          <a
            class="game"
            href="${g.url}"
            target="_blank"
            rel="noopener"
          >

            <div class="gicon">${g.icon}</div>

            <strong>${g.name}</strong>

            <small>${g.text}</small>

          </a>

        `).join("")}

      </div>

    `;

  }


  else if(type==="security"){

    title.textContent="امنیت";

    content.innerHTML=`

      <div class="info">

        امنیت حساب و ورود سریع در این بخش قرار می‌گیرد.

        <br>

        اثر انگشت دستگاه بعد از اتصال Mini App به محیط امن Telegram فعال می‌شود.

      </div>

    `;

  }


  else{

    title.textContent="حساب";

    content.innerHTML=`

      <div class="info">

        پروفایل، تنظیمات و اطلاعات حساب در این بخش قرار می‌گیرد.

      </div>

    `;

  }


  overlay.classList.add("show");

}


function closePanel(e){

  if(
    !e ||
    e.target.id==="overlay"
  ){

    document
      .getElementById("overlay")
      .classList.remove("show");

  }

}


function setActive(el){

  document
    .querySelectorAll(".nav-item")
    .forEach(x=>x.classList.remove("active"));

  el.classList.add("active");

}


</script>

</body>
</html>
